name: CI - Validação de Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Verificar se index.html existe
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERRO: index.html não encontrado na raiz!"
            exit 1
          fi